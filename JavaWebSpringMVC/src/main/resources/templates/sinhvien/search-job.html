<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tìm kiếm việc làm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">QL Sinh Viên</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/sinhvien/search-basic">Tìm kiếm cơ bản</a>
            <a class="nav-link active" href="/sinhvien/search-job">Tìm kiếm việc làm</a>
            <a class="nav-link" href="/sinhvien/add">Thêm mới</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h3 class="mb-4">Tìm kiếm thông tin tốt nghiệp và việc làm</h3>
    <form th:action="@{/sinhvien/search-job}" method="get" class="row g-3 mb-4">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="Nhập họ tên..." th:value="${param.keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm kiếm</button>
        </div>
    </form>

    <table class="table table-bordered table-striped bg-white">
        <thead class="table-dark">
            <tr>
                <th>Số CMND</th>
                <th>Họ Tên</th>
                <th>Mã Ngành (TN)</th>
                <th>Mã Trường (TN)</th>
                <th>Mã Ngành (CT)</th>
                <th>Tên Công Ty</th>
                <th>Thời Gian Làm Việc</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${results}">
                <td th:text="${r.soCMND}"></td>
                <td th:text="${r.hoTen}"></td>
                <td th:text="${r.maNganh}"></td>
                <td th:text="${r.maTruong}"></td>
                <td th:text="${r.maNganhCongTy}"></td>
                <td th:text="${r.tenCongTy}"></td>
                <td th:text="${r.thoiGianLamViec}"></td>
            </tr>
            <tr th:if="${results == null or #lists.isEmpty(results)}">
                <td colspan="7" class="text-center">Không có dữ liệu</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
