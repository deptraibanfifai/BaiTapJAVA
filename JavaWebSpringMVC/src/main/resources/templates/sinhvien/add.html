<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Khai báo thông tin tốt nghiệp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">Nhập thông tin Sinh viên tốt nghiệp</h2>
    <form th:action="@{/sinhvien/add}" th:object="${dto}" method="post">
        <div class="row">
            <!-- Sinh Vien Info -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Số CMND *</label>
                <input type="text" th:field="*{sinhVien.soCMND}" class="form-control" />
                <div class="error" th:if="${#fields.hasErrors('sinhVien.soCMND')}" th:errors="*{sinhVien.soCMND}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" th:field="*{sinhVien.hoTen}" class="form-control" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{sinhVien.email}" class="form-control" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{sinhVien.soDT}" class="form-control" />
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Địa chỉ</label>
                <input type="text" th:field="*{sinhVien.diaChi}" class="form-control" />
            </div>

            <hr>
            <h5>Thông tin tốt nghiệp</h5>

            <div class="col-md-6 mb-3">
                <label class="form-label">Trường *</label>
                <select th:field="*{totNghiep.maTruong}" class="form-select">
                    <option value="">-- Chọn trường --</option>
                    <option th:each="t : ${dsTruong}" th:value="${t.maTruong}" th:text="${t.tenTruong}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('totNghiep.maTruong')}" th:errors="*{totNghiep.maTruong}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngành *</label>
                <select th:field="*{totNghiep.maNganh}" class="form-select">
                    <option value="">-- Chọn ngành --</option>
                    <option th:each="n : ${dsNganh}" th:value="${n.maNganh}" th:text="${n.tenNganh}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('totNghiep.maNganh')}" th:errors="*{totNghiep.maNganh}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Hệ đào tạo</label>
                <input type="text" th:field="*{totNghiep.heDT}" class="form-control" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Loại tốt nghiệp</label>
                <input type="text" th:field="*{totNghiep.loaiTN}" class="form-control" />
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày tốt nghiệp (NgayTN) *</label>
                <input type="date" th:field="*{totNghiep.ngayTN}" class="form-control" />
                <div class="error" th:if="${#fields.hasErrors('totNghiep.ngayTN')}" th:errors="*{totNghiep.ngayTN}"></div>
            </div>

            <hr>
            <h5>Thông tin việc làm (Tùy chọn)</h5>
            <div class="col-md-4 mb-3">
                <label class="form-label">Mã ngành công ty</label>
                <input type="text" th:field="*{totNghiep.maNganhCongTy}" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Tên công ty</label>
                <input type="text" th:field="*{totNghiep.tenCongTy}" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Thời gian làm việc</label>
                <input type="text" th:field="*{totNghiep.thoiGianLamViec}" class="form-control" />
            </div>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5">Lưu thông tin</button>
            <a href="/sinhvien/search-basic" class="btn btn-secondary px-5">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
