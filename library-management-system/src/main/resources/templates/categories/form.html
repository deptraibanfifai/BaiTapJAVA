<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa danh mục' : 'Thêm danh mục mới'">Form Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div class="page-header">
            <h2><i class="fas fa-tags"></i>
                <span th:text="${isEdit} ? 'Chỉnh sửa danh mục' : 'Thêm danh mục mới'"></span>
            </h2>
            <a th:href="@{/categories}" class="btn-custom secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="content-card">
            <div class="card-header-custom">
                <h3><i class="fas fa-info-circle"></i> Thông tin danh mục</h3>
            </div>
            <div class="card-body-custom">
                <form th:action="${isEdit} ? @{/categories/update/{id}(id=${category.id})} : @{/categories/create}"
                      th:object="${category}" method="post">
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

                    <div class="form-group-custom">
                        <label>Tên danh mục <span class="required">*</span></label>
                        <input type="text" class="form-control-custom" th:field="*{name}"
                               placeholder="Ví dụ: Văn học, Khoa học..." required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}" style="font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div class="form-group-custom">
                        <label>Mô tả</label>
                        <textarea class="form-control-custom" th:field="*{description}"
                                  rows="4" placeholder="Mô tả về danh mục này..."></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-custom primary">
                            <i class="fas fa-save"></i> <span th:text="${isEdit} ? 'Cập nhật' : 'Lưu'"></span>
                        </button>
                        <a th:href="@{/categories}" class="btn-custom secondary">
                            <i class="fas fa-times"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
