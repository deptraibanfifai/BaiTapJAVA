<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Tiền phạt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div class="page-header">
            <h2><i class="fas fa-plus-circle"></i> Tạo Tiền phạt</h2>
            <a th:href="@{/fines}" class="btn-custom secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="content-card">
            <div class="card-header-custom">
                <h3><i class="fas fa-exclamation-triangle"></i> Thông tin tiền phạt</h3>
            </div>
            <div class="card-body-custom">
                <form th:action="@{/fines/create}" th:object="${fine}" method="post">
                    <div class="form-group-custom">
                        <label>Mã phiếu mượn <span class="required">*</span></label>
                        <input type="number" class="form-control-custom" th:field="*{borrowReceiptId}"
                               placeholder="Nhập mã phiếu mượn" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('borrowReceiptId')}"
                             th:errors="*{borrowReceiptId}" style="font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div class="form-group-custom">
                        <label>Lý do <span class="required">*</span></label>
                        <input type="text" class="form-control-custom" th:field="*{reason}"
                               placeholder="Ví dụ: Trả sách quá hạn, làm mất sách..." required>
                        <div class="text-danger" th:if="${#fields.hasErrors('reason')}"
                             th:errors="*{reason}" style="font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div class="form-group-custom">
                        <label>Số tiền (VNĐ) <span class="required">*</span></label>
                        <input type="number" class="form-control-custom" th:field="*{amount}"
                               min="0" step="1000" placeholder="Ví dụ: 50000" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('amount')}"
                             th:errors="*{amount}" style="font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-custom primary">
                            <i class="fas fa-save"></i> Lưu tiền phạt
                        </button>
                        <a th:href="@{/fines}" class="btn-custom secondary">
                            <i class="fas fa-times"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
