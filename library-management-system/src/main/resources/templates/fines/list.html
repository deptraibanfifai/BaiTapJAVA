<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Quản lý Tiền phạt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div th:if="${successMessage}" class="alert-custom success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert-custom danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="page-header">
            <h2><i class="fas fa-money-bill-wave"></i> <span th:text="${pageTitle}">Tiền phạt</span></h2>
            <a th:href="@{/fines/create}" class="btn-custom primary">
                <i class="fas fa-plus"></i> Tạo tiền phạt
            </a>
        </div>

        <div class="content-card">
            <div class="card-body-custom" style="padding: 0; overflow-x: auto;">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>Mã phiếu</th>
                        <th>Độc giả</th>
                        <th>Lý do</th>
                        <th>Số tiền</th>
                        <th>Trạng thái</th>
                        <th>Ngày thanh toán</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="fine : ${fines}">
                        <td th:text="${fine.receiptCode}"></td>
                        <td th:text="${fine.memberName}"></td>
                        <td th:text="${fine.reason}"></td>
                        <td>
                            <strong style="color: var(--accent-danger);"
                                    th:text="${#numbers.formatCurrency(fine.amount)}"></strong>
                        </td>
                        <td>
                                    <span class="badge-custom"
                                          th:classappend="${fine.paymentStatus == 'UNPAID'} ? 'danger' : 'success'"
                                          th:text="${fine.paymentStatus == 'UNPAID'} ? 'Chưa thanh toán' : 'Đã thanh toán'"></span>
                        </td>
                        <td th:text="${fine.paymentDate != null} ? ${#temporals.format(fine.paymentDate, 'dd/MM/yyyy')} : '-'"></td>
                        <td style="text-align: center;">
                            <form th:action="@{/fines/pay/{id}(id=${fine.id})}" method="post" style="display:inline;"
                                  th:if="${fine.paymentStatus == 'UNPAID'}">
                                <button type="submit" class="btn-custom success sm"
                                        onclick="return confirm('Xác nhận đã thanh toán?')">
                                    <i class="fas fa-check"></i> Đã trả
                                </button>
                            </form>
                            <span th:if="${fine.paymentStatus != 'UNPAID'}" class="text-muted" style="font-size: 13px;">
                                        <i class="fas fa-check-circle"></i> Hoàn tất
                                    </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(fines)}">
                        <td colspan="7">
                            <div class="empty-state">
                                <i class="fas fa-money-bill-wave"></i>
                                <p>Chưa có tiền phạt nào</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
