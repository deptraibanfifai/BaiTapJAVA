<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa tác giả' : 'Thêm tác giả mới'">Form Tác giả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div class="page-header">
            <h2><i class="fas fa-pen-nib"></i>
                <span th:text="${isEdit} ? 'Chỉnh sửa tác giả' : 'Thêm tác giả mới'"></span>
            </h2>
            <a th:href="@{/authors}" class="btn-custom secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="content-card">
            <div class="card-header-custom">
                <h3><i class="fas fa-user-edit"></i> Thông tin tác giả</h3>
            </div>
            <div class="card-body-custom">
                <form th:action="${isEdit} ? @{/authors/update/{id}(id=${author.id})} : @{/authors/create}"
                      th:object="${author}" method="post">
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

                    <div class="form-group-custom">
                        <label>Tên tác giả <span class="required">*</span></label>
                        <input type="text" class="form-control-custom" th:field="*{name}"
                               placeholder="Ví dụ: Nguyễn Nhật Ánh" required>
                        <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}" style="font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div class="form-group-custom">
                        <label>Quốc tịch</label>
                        <input type="text" class="form-control-custom" th:field="*{nationality}"
                               placeholder="Ví dụ: Việt Nam">
                    </div>

                    <div class="form-group-custom">
                        <label>Tiểu sử</label>
                        <textarea class="form-control-custom" th:field="*{biography}"
                                  rows="5" placeholder="Tiểu sử, sự nghiệp của tác giả..."></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-custom primary">
                            <i class="fas fa-save"></i> <span th:text="${isEdit} ? 'Cập nhật' : 'Lưu'"></span>
                        </button>
                        <a th:href="@{/authors}" class="btn-custom secondary">
                            <i class="fas fa-times"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
