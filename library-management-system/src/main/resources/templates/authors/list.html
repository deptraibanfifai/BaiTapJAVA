<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Quản lý Tác giả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div th:if="${successMessage}" class="alert-custom success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert-custom danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="page-header">
            <h2><i class="fas fa-pen-nib"></i> <span th:text="${pageTitle}">Tác giả</span></h2>
            <a th:href="@{/authors/create}" class="btn-custom primary">
                <i class="fas fa-plus"></i> Thêm mới
            </a>
        </div>

        <div class="content-card">
            <div class="card-body-custom" style="padding: 0; overflow-x: auto;">
                <table class="table-custom">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên tác giả</th>
                        <th>Quốc tịch</th>
                        <th>Ngày tạo</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="author : ${authors}">
                        <td th:text="${author.id}"></td>
                        <td>
                            <strong th:text="${author.name}"></strong>
                        </td>
                        <td>
                            <span class="badge-custom info" th:text="${author.nationality} ?: '-'"></span>
                        </td>
                        <td th:text="${#temporals.format(author.createdAt, 'dd/MM/yyyy')}"></td>
                        <td style="text-align: center;">
                            <a th:href="@{/authors/edit/{id}(id=${author.id})}" class="btn-custom warning sm icon-only">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/authors/delete/{id}(id=${author.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn-custom danger sm icon-only"
                                        onclick="return confirm('Xác nhận xóa?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(authors)}">
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-pen-nib"></i>
                                <p>Chưa có tác giả nào</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
