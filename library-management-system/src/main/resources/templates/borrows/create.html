<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo Phiếu Mượn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div class="page-header">
            <h2><i class="fas fa-plus-circle"></i> Tạo Phiếu Mượn Mới</h2>
            <a th:href="@{/borrows}" class="btn-custom secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="content-card">
            <div class="card-header-custom">
                <h3><i class="fas fa-info-circle"></i> Thông tin phiếu mượn</h3>
            </div>
            <div class="card-body-custom">
                <form th:action="@{/borrows/create}" th:object="${borrow}" method="post">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group-custom">
                                <label>Độc giả <span class="required">*</span></label>
                                <select class="form-control-custom" th:field="*{memberId}" required>
                                    <option value="">-- Chọn độc giả --</option>
                                    <option th:each="member : ${members}"
                                            th:value="${member.id}"
                                            th:text="${member.fullName} + ' (' + ${member.memberCode} + ')'"></option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('memberId')}"
                                     th:errors="*{memberId}" style="font-size: 12px; margin-top: 4px;"></div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group-custom">
                                <label>Ngày mượn <span class="required">*</span></label>
                                <input type="date" class="form-control-custom" th:field="*{borrowDate}" required>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group-custom">
                                <label>Ngày phải trả <span class="required">*</span></label>
                                <input type="date" class="form-control-custom" th:field="*{dueDate}" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label>Ghi chú</label>
                        <textarea class="form-control-custom" th:field="*{notes}" rows="2"
                                  placeholder="Ghi chú thêm (nếu có)..."></textarea>
                    </div>

                    <hr style="border-color: var(--border-color); margin: 24px 0;">

                    <h5 class="mb-3" style="color: var(--text-primary);">
                        <i class="fas fa-book"></i> Chọn sách mượn
                    </h5>

                    <div id="bookItems">
                        <div class="book-item row mb-3 p-3" style="background: var(--bg-primary); border-radius: 10px; border: 1px solid var(--border-color);">
                            <div class="col-md-8">
                                <label class="form-label">Sách</label>
                                <select class="form-control-custom book-select" name="books[0].bookId" required>
                                    <option value="">-- Chọn sách --</option>
                                    <option th:each="book : ${books}"
                                            th:value="${book.id}"
                                            th:text="${book.title} + ' (Còn: ' + ${book.availableQuantity} + ')'"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Số lượng</label>
                                <input type="number" class="form-control-custom" name="books[0].quantity"
                                       value="1" min="1" required>
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button" class="btn-custom danger sm icon-only remove-book"
                                        style="display:none;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn-custom secondary mb-3" id="addBook">
                        <i class="fas fa-plus"></i> Thêm sách
                    </button>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-custom primary">
                            <i class="fas fa-check-circle"></i> Tạo phiếu mượn
                        </button>
                        <a th:href="@{/borrows}" class="btn-custom secondary">
                            <i class="fas fa-times"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let bookIndex = 1;

    document.getElementById('addBook').addEventListener('click', function() {
        const bookItems = document.getElementById('bookItems');
        const newBookItem = document.createElement('div');
        newBookItem.className = 'book-item row mb-3 p-3';
        newBookItem.style.cssText = 'background: var(--bg-primary); border-radius: 10px; border: 1px solid var(--border-color);';
        newBookItem.innerHTML = `
            <div class="col-md-8">
                <label class="form-label">Sách</label>
                <select class="form-control-custom book-select" name="books[${bookIndex}].bookId" required>
                    <option value="">-- Chọn sách --</option>
                    ${document.querySelector('.book-select').innerHTML}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Số lượng</label>
                <input type="number" class="form-control-custom" name="books[${bookIndex}].quantity" value="1" min="1" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn-custom danger sm icon-only remove-book">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        bookItems.appendChild(newBookItem);
        bookIndex++;
        document.querySelectorAll('.remove-book').forEach(btn => btn.style.display = 'inline-flex');
    });

    document.addEventListener('click', function(e) {
        if (e.target.closest('.remove-book')) {
            e.target.closest('.book-item').remove();
            const items = document.querySelectorAll('.book-item');
            if (items.length === 1) {
                document.querySelectorAll('.remove-book').forEach(btn => btn.style.display = 'none');
            }
        }
    });
</script>
</body>
</html>
