<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa độc giả' : 'Thêm độc giả mới'">Form Độc giả</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout/header :: header}"></div>

    <div class="content-area">
        <div class="page-header">
            <h2><i class="fas fa-user-plus"></i>
                <span th:text="${isEdit} ? 'Chỉnh sửa độc giả' : 'Thêm độc giả mới'"></span>
            </h2>
            <a th:href="@{/members}" class="btn-custom secondary">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <div class="content-card">
            <div class="card-header-custom">
                <h3><i class="fas fa-id-card"></i> Thông tin độc giả</h3>
            </div>
            <div class="card-body-custom">
                <form th:action="${isEdit} ? @{/members/update/{id}(id=${member.id})} : @{/members/create}"
                      th:object="${member}" method="post">
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group-custom">
                                <label>Mã độc giả <span class="required">*</span></label>
                                <input type="text" class="form-control-custom" th:field="*{memberCode}"
                                       placeholder="Ví dụ: MB00001" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('memberCode')}"
                                     th:errors="*{memberCode}" style="font-size: 12px; margin-top: 4px;"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group-custom">
                                <label>Họ tên <span class="required">*</span></label>
                                <input type="text" class="form-control-custom" th:field="*{fullName}"
                                       placeholder="Họ và tên đầy đủ" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}" style="font-size: 12px; margin-top: 4px;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group-custom">
                                <label>Email</label>
                                <input type="email" class="form-control-custom" th:field="*{email}"
                                       placeholder="email@example.com">
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}" style="font-size: 12px; margin-top: 4px;"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group-custom">
                                <label>Số điện thoại</label>
                                <input type="tel" class="form-control-custom" th:field="*{phone}"
                                       placeholder="0123456789">
                            </div>
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label>Địa chỉ</label>
                        <textarea class="form-control-custom" th:field="*{address}"
                                  rows="2" placeholder="Địa chỉ liên hệ..."></textarea>
                    </div>

                    <div class="form-group-custom">
                        <label>Ngày đăng ký</label>
                        <input type="date" class="form-control-custom" th:field="*{registrationDate}">
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn-custom primary">
                            <i class="fas fa-save"></i> <span th:text="${isEdit} ? 'Cập nhật' : 'Lưu'"></span>
                        </button>
                        <a th:href="@{/members}" class="btn-custom secondary">
                            <i class="fas fa-times"></i> Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
